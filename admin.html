<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Админка — Генератор ключей</title>
<style>
* { box-sizing: border-box; font-family: Segoe UI, Arial, sans-serif; }
body { margin: 0; background: #f5f7fb; color: #1f2937; }
header { background: #1e40af; color: #fff; padding: 16px 24px; }
header h1 { margin: 0; font-size: 20px; }
.container { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
.card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
.card h2 { margin: 0 0 12px; color: #1e40af; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
label { display: block; font-size: 12px; color: #4b5563; margin-bottom: 4px; }
input, select { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 13px; }
.btn { background: #1e40af; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-right: 6px; }
.btn:hover { opacity: .9; }
.btn-ok { background: #16a34a; }
.btn-warn { background: #dc2626; }
.btn-sec { background: #6b7280; }
table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
th, td { border: 1px solid #d1d5db; padding: 6px; text-align: left; }
th { background: #f3f4f6; }
.key-code { font-family: monospace; background: #f0f9ff; padding: 4px 8px; border-radius: 4px; font-weight: bold; color: #1e40af; }
.login-form { max-width: 400px; margin: 100px auto; padding: 30px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.login-form h2 { text-align: center; color: #1e40af; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat-card { background: #f9fafb; padding: 16px; border-radius: 8px; text-align: center; border-left: 4px solid #1e40af; }
.stat-card .num { font-size: 28px; font-weight: 700; color: #1e40af; }
.stat-card .lbl { font-size: 12px; color: #6b7280; }
</style>
</head>
<body>

<header>
  <h1>🔐 Админка — Судейский комитет по каратэ</h1>
</header>

<div class="container">

<div id="loginSection" class="login-form">
  <h2>🔐 Вход в админку</h2>
  <label>Пароль администратора:</label>
  <input type="password" id="adminPassword" placeholder="Введите пароль">
  <div id="loginError" style="color:#dc2626;margin-top:8px;font-size:13px"></div>
  <button class="btn btn-ok" onclick="login()" style="margin-top:12px;width:100%">Войти</button>
  <p style="margin-top:16px;font-size:12px;color:#6b7280;text-align:center">
    Тестовый пароль: <code>admin123</code>
  </p>
</div>

<div id="adminSection" style="display:none">

<div class="card">
  <h2>📊 Статистика</h2>
  <div class="stats-grid" id="statsGrid"></div>
  <button class="btn btn-sec" onclick="exportAllStats()">📥 Экспорт всей статистики (CSV)</button>
  <button class="btn btn-warn" onclick="if(confirm('Очистить всю статистику?')){localStorage.removeItem('activations');localStorage.removeItem('localStats');renderStats();}">🗑 Очистить статистику</button>
</div>

<div class="card">
  <h2>🔑 Генерация нового ключа</h2>
  <div class="grid">
    <div>
      <label>Тип ключа</label>
      <select id="keyType">
        <option value="test">Тестовый (10 выгрузок)</option>
        <option value="premium">Премиум (100 выгрузок)</option>
        <option value="universal">Универсальный (безлимит)</option>
        <option value="custom">Свои настройки</option>
      </select>
    </div>
    <div>
      <label>Срок действия (дней)</label>
      <input type="number" id="keyDays" value="730">
    </div>
    <div>
      <label>Привязка к email (опционально)</label>
      <input type="email" id="keyEmail" placeholder="user@example.com">
    </div>
    <div>
      <label>Макс. устройств (-1 = безлимит)</label>
      <input type="number" id="keyDevices" value="1">
    </div>
  </div>
  <div id="customSettings" style="display:none;margin-top:12px">
    <div class="grid">
      <div>
        <label>Макс. выгрузок (-1 = безлимит)</label>
        <input type="number" id="customExports" value="50">
      </div>
      <div>
        <label>Описание</label>
        <input type="text" id="customDesc" placeholder="Например: Для Иванова И.И.">
      </div>
    </div>
  </div>
  <button class="btn btn-ok" onclick="generateKey()" style="margin-top:12px">🎲 Сгенерировать ключ</button>
  <div id="generatedKey" style="margin-top:12px"></div>
</div>

<div class="card">
  <h2>📋 Список всех ключей</h2>
  <button class="btn btn-sec" onclick="renderKeys()">🔄 Обновить</button>
  <button class="btn btn-warn" onclick="if(confirm('Удалить ВСЕ ключи?')){localStorage.removeItem('adminKeys');renderKeys();}">🗑 Удалить все</button>
  <div id="keysList"></div>
</div>

<div class="card">
  <h2>👥 Активации (кто использовал ключи)</h2>
  <button class="btn btn-sec" onclick="renderActivations()">🔄 Обновить</button>
  <div id="activationsList"></div>
</div>

<div class="card">
  <h2>⚙️ Настройки</h2>
  <button class="btn btn-warn" onclick="changePassword()">🔑 Сменить пароль админа</button>
  <button class="btn btn-sec" onclick="logout()">🚪 Выйти</button>
</div>

</div>
</div>

<script>
const DEFAULT_ADMIN_HASH = '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9';

async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function getAdminHash() {
  return localStorage.getItem('adminHash') || DEFAULT_ADMIN_HASH;
}

async function login() {
  const password = document.getElementById('adminPassword').value;
  const errorDiv = document.getElementById('loginError');
  if (!password) { errorDiv.textContent = 'Введите пароль'; return; }
  const hash = await sha256(password);
  if (hash === getAdminHash()) {
    sessionStorage.setItem('adminAuth', 'true');
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('adminSection').style.display = 'block';
    renderStats(); renderKeys(); renderActivations();
  } else { errorDiv.textContent = 'Неверный пароль'; }
}

function logout() {
  sessionStorage.removeItem('adminAuth');
  document.getElementById('loginSection').style.display = 'block';
  document.getElementById('adminSection').style.display = 'none';
}

async function changePassword() {
  const newPass = prompt('Введите новый пароль:');
  if (!newPass) return;
  const confirmPass = prompt('Повторите пароль:');
  if (newPass !== confirmPass) { alert('Пароли не совпадают'); return; }
  const hash = await sha256(newPass);
  localStorage.setItem('adminHash', hash);
  alert('✓ Пароль изменён');
}

if (sessionStorage.getItem('adminAuth') === 'true') {
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('adminSection').style.display = 'block';
  renderStats(); renderKeys(); renderActivations();
}

function generateKey() {
  const type = document.getElementById('keyType').value;
  const days = parseInt(document.getElementById('keyDays').value);
  const email = document.getElementById('keyEmail').value.trim();
  const devices = parseInt(document.getElementById('keyDevices').value);
  const prefix = 'KARATE';
  const random = Math.random().toString(36).substring(2, 8).toUpperCase();
  const date = new Date().toISOString().split('T')[0].replace(/-/g, '').substring(2);
  const keyCode = `${prefix}-${type.toUpperCase().substring(0, 4)}-${date}-${random}`;
  const expires = new Date();
  expires.setDate(expires.getDate() + days);
  const expiresAt = expires.toISOString().split('T')[0];
  let maxExports, description;
  switch(type) {
    case 'test': maxExports = 10; description = `Тестовый ключ${email ? ' для ' + email : ''}`; break;
    case 'premium': maxExports = 100; description = `Премиум ключ${email ? ' для ' + email : ''}`; break;
    case 'universal': maxExports = -1; description = `Универсальный безлимит${email ? ' для ' + email : ''}`; break;
    case 'custom': maxExports = parseInt(document.getElementById('customExports').value); description = document.getElementById('customDesc').value || `Ключ${email ? ' для ' + email : ''}`; break;
  }
  const keys = JSON.parse(localStorage.getItem('adminKeys') || '{}');
  keys[keyCode] = { type, maxExports, expiresAt, maxDevices: devices, description, email: email || null, createdAt: new Date().toISOString() };
  localStorage.setItem('adminKeys', JSON.stringify(keys));
  document.getElementById('generatedKey').innerHTML = `
    <div style="background:#f0fdf4;border:2px solid #16a34a;border-radius:8px;padding:16px">
      <p style="margin:0 0 8px"><strong>✓ Ключ сгенерирован:</strong></p>
      <p style="margin:0 0 8px;font-size:20px"><code class="key-code">${keyCode}</code></p>
      <p style="margin:0;font-size:12px;color:#6b7280">
        Тип: ${description}<br>
        Выгрузок: ${maxExports === -1 ? 'безлимит' : maxExports}<br>
        Действует до: ${expiresAt}<br>
        Устройств: ${devices === -1 ? 'безлимит' : devices}
        ${email ? '<br>Привязан к: ' + email : ''}
      </p>
      <button class="btn btn-sec" onclick="navigator.clipboard.writeText('${keyCode}').then(()=>alert('Скопировано!'))" style="margin-top:8px">📋 Копировать</button>
    </div>
  `;
  renderKeys();
}

function renderKeys() {
  const keys = JSON.parse(localStorage.getItem('adminKeys') || '{}');
  const activations = JSON.parse(localStorage.getItem('activations') || '{}');
  if (Object.keys(keys).length === 0) {
    document.getElementById('keysList').innerHTML = '<p style="color:#6b7280">Ключей пока нет</p>';
    return;
  }
  let html = `<table><tr><th>Код ключа</th><th>Тип</th><th>Описание</th><th>Выгрузок</th><th>Действует до</th><th>Привязан к email</th><th>Активирован</th><th>Действия</th></tr>`;
  Object.entries(keys).forEach(([code, data]) => {
    const activation = activations[code];
    const expired = new Date(data.expiresAt) < new Date();
    html += `<tr style="${expired ? 'opacity:0.5' : ''}">
      <td><code class="key-code">${code}</code></td>
      <td>${data.type}</td>
      <td>${data.description || '-'}</td>
      <td>${data.maxExports === -1 ? '∞' : data.maxExports}</td>
      <td>${data.expiresAt}${expired ? ' <span style="color:#dc2626">(истёк)</span>' : ''}</td>
      <td>${data.email || '-'}</td>
      <td>${activation ? `✓ ${activation.email}<br><small>${new Date(activation.activatedAt).toLocaleDateString('ru-RU')}</small>` : '—'}</td>
      <td><button class="btn btn-warn" onclick="deleteKey('${code}')" style="padding:4px 8px;font-size:11px">✕ Удалить</button></td>
    </tr>`;
  });
  html += '</table>';
  document.getElementById('keysList').innerHTML = html;
}

function deleteKey(code) {
  if (!confirm(`Удалить ключ ${code}?`)) return;
  const keys = JSON.parse(localStorage.getItem('adminKeys') || '{}');
  delete keys[code];
  localStorage.setItem('adminKeys', JSON.stringify(keys));
  renderKeys();
}

function renderActivations() {
  const activations = JSON.parse(localStorage.getItem('activations') || '{}');
  if (Object.keys(activations).length === 0) {
    document.getElementById('activationsList').innerHTML = '<p style="color:#6b7280">Активаций пока нет</p>';
    return;
  }
  let html = `<table><tr><th>Ключ</th><th>Email пользователя</th><th>Тип</th><th>Дата активации</th><th>Device ID</th></tr>`;
  Object.entries(activations).forEach(([code, data]) => {
    html += `<tr><td><code>${code}</code></td><td><b>${data.email}</b></td><td>${data.type}</td><td>${new Date(data.activatedAt).toLocaleString('ru-RU')}</td><td style="font-size:10px;font-family:monospace">${data.deviceId}</td></tr>`;
  });
  html += '</table>';
  document.getElementById('activationsList').innerHTML = html;
}

function renderStats() {
  const activations = JSON.parse(localStorage.getItem('activations') || '{}');
  const keys = JSON.parse(localStorage.getItem('adminKeys') || '{}');
  const totalActivations = Object.keys(activations).length;
  const totalKeys = Object.keys(keys).length;
  const activeKeys = Object.values(keys).filter(k => new Date(k.expiresAt) > new Date()).length;
  const byType = {};
  Object.values(activations).forEach(a => { byType[a.type] = (byType[a.type] || 0) + 1; });
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="num">${totalKeys}</div><div class="lbl">Всего ключей</div></div>
    <div class="stat-card"><div class="num">${activeKeys}</div><div class="lbl">Активных ключей</div></div>
    <div class="stat-card"><div class="num">${totalActivations}</div><div class="lbl">Всего активаций</div></div>
    <div class="stat-card"><div class="num">${byType.universal || 0}</div><div class="lbl">Универсальных</div></div>
    <div class="stat-card"><div class="num">${byType.premium || 0}</div><div class="lbl">Премиум</div></div>
    <div class="stat-card"><div class="num">${byType.test || 0}</div><div class="lbl">Тестовых</div></div>
  `;
}

function exportAllStats() {
  const activations = JSON.parse(localStorage.getItem('activations') || '{}');
  const keys = JSON.parse(localStorage.getItem('adminKeys') || '{}');
  let csv = 'ТИП ОТЧЁТА,Данные\n\nКЛЮЧИ\n';
  csv += 'Код,Тип,Описание,Макс.выгрузок,Действует до,Email привязки,Создан\n';
  Object.entries(keys).forEach(([code, data]) => {
    csv += `"${code}","${data.type}","${data.description}",${data.maxExports},"${data.expiresAt}","${data.email || ''}","${data.createdAt}"\n`;
  });
  csv += '\nАКТИВАЦИИ\n';
  csv += 'Ключ,Email,Тип,Дата активации,Device ID\n';
  Object.entries(activations).forEach(([code, data]) => {
    csv += `"${code}","${data.email}","${data.type}","${data.activatedAt}","${data.deviceId}"\n`;
  });
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `admin_stats_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
}

document.getElementById('keyType').addEventListener('change', (e) => {
  document.getElementById('customSettings').style.display = e.target.value === 'custom' ? 'block' : 'none';
});
</script>

</body>
</html>
